<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mentoria Meritus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root { color-scheme:light; --ground:#F3F5F8; --surface:#FFFFFF; --ink:#111823; --ink-2:#4B5666; --ink-3:#7C8798; --line:#DCE1E8; --accent:#1B2A4A; }
@media (prefers-color-scheme: dark) { :root { color-scheme:dark; --ground:#0D1117; --surface:#161C25; --ink:#E7ECF3; --ink-2:#A2AEBE; --ink-3:#6C7889; --line:#28313D; --accent:#93B4FF; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:"Archivo",Arial,sans-serif; font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
.wrap { max-width:720px; margin:0 auto; padding:56px 20px 80px; }
h1 { font-size:26px; font-weight:700; letter-spacing:-.025em; margin:0 0 6px; }
.sub { font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-3); margin:0 0 36px; }
a.card { display:flex; align-items:baseline; gap:12px; text-decoration:none; color:inherit; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:16px 18px; margin-bottom:10px; transition:transform .12s ease; }
a.card:hover { transform:translateX(3px); }
a.card .nome { font-size:16px; font-weight:600; letter-spacing:-.01em; }
a.card .per { font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-3); margin-left:auto; white-space:nowrap; }
footer { margin-top:44px; padding-top:18px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-3); }
</style></head><body>
<div class="wrap">
  <h1>Mentoria Meritus</h1>
  <p class="sub">Planos de estudo · Professor Jazz</p>
  <a class="card" href="lara/"><span class="nome">Lara Pacheco</span><span class="per">3 – 15 nov 2026</span></a>
  <footer>Cada plano abre no navegador e guarda sozinho os tempos marcados como feitos, no próprio aparelho.</footer>
</div>
</body></html>
